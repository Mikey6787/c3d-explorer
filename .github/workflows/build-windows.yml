name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload assets to (e.g. v1.0.0, or leave blank to build only)'
        required: false
        default: 'v1.0.0'
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    name: Package Windows .exe & Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate multi-resolution Windows app.ico
        run: |
          python -c "from PIL import Image; img = Image.open('assets/icons/AppIcon-Dark.png').convert('RGBA'); img.save('assets/icons/app.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build standalone app with PyInstaller
        run: |
          pyinstaller --clean --distpath dist --workpath build packaging/c3d_explorer.spec

      - name: Compile Inno Setup Windows Installer
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/installer.iss
          } elseif (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc packaging/installer.iss
          } else {
            choco install innosetup --no-progress
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/installer.iss
            } else {
              iscc packaging/installer.iss
            }
          }

      - name: Create Portable ZIP Archive
        run: |
          Compress-Archive -Path dist\C3DExplorer -DestinationPath dist_installer\C3D_Explorer_Windows_Portable.zip

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: C3D-Explorer-Windows-Setup-Installer
          path: dist_installer/C3D_Explorer_Windows_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Portable Zip Package
        uses: actions/upload-artifact@v4
        with:
          name: C3D-Explorer-Windows-Portable-Zip
          path: dist_installer/C3D_Explorer_Windows_Portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_tag }}
          files: |
            dist_installer/C3D_Explorer_Windows_Setup.exe
            dist_installer/C3D_Explorer_Windows_Portable.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
