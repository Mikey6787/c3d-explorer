name: Build Windows Installer

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    name: Package Windows .exe & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build standalone app with PyInstaller
        run: |
          pyinstaller --clean --distpath dist --workpath build packaging/c3d_explorer.spec

      - name: Compile Inno Setup Windows Installer
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/installer.iss
          } elseif (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc packaging/installer.iss
          } else {
            choco install innosetup --no-progress
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/installer.iss
            } else {
              iscc packaging/installer.iss
            }
          }

      - name: Create Portable ZIP Archive
        run: |
          Compress-Archive -Path dist\C3DExplorer -DestinationPath dist_installer\C3D_Explorer_Windows_Portable.zip

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: C3D-Explorer-Windows-Setup-Installer
          path: dist_installer/C3D_Explorer_Windows_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Portable Zip Package
        uses: actions/upload-artifact@v4
        with:
          name: C3D-Explorer-Windows-Portable-Zip
          path: dist_installer/C3D_Explorer_Windows_Portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installer/C3D_Explorer_Windows_Setup.exe
            dist_installer/C3D_Explorer_Windows_Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
