name: Build & Package Releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload assets to (e.g. v1.0.1, or leave blank to build only)'
        required: false
        default: 'v1.0.1'
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # 1. WINDOWS BUILD JOB
  # ============================================================================
  build-windows:
    name: Package Windows .exe & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate multi-resolution Windows app.ico
        run: |
          python -c "from PIL import Image; img = Image.open('assets/icons/AppIcon-Dark.png').convert('RGBA'); img.save('assets/icons/app.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build standalone app with PyInstaller
        run: |
          pyinstaller --clean --distpath dist --workpath build packaging/c3d_explorer.spec

      - name: Compile Inno Setup Windows Installer
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/installer.iss
          } elseif (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc packaging/installer.iss
          } else {
            choco install innosetup --no-progress
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/installer.iss
            } else {
              iscc packaging/installer.iss
            }
          }

      - name: Create Portable ZIP Archive
        run: |
          Compress-Archive -Path dist\C3DExplorer -DestinationPath dist_installer\C3D_Explorer_Windows_Portable.zip

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist_installer/C3D_Explorer_Windows_Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist_installer/C3D_Explorer_Windows_Portable.zip
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 2. MACOS BUILD JOB
  # ============================================================================
  build-macos:
    name: Package macOS .app & DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build macOS App & DMG Installer
        run: |
          bash packaging/build_mac.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist_dmg/C3D_Explorer_Mac.dmg
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 3. PUBLISH RELEASE JOB (Runs when all OS builds finish)
  # ============================================================================
  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            VER=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*[\"\'\']([^\"\'\']+)[\"\'\']', open('core/__init__.py').read()).group(1))")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Target Release Tag: ${TAG}"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: List downloaded release assets
        run: ls -lh release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ${{ steps.get_tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            release_assets/C3D_Explorer_Windows_Setup.exe
            release_assets/C3D_Explorer_Windows_Portable.zip
            release_assets/C3D_Explorer_Mac.dmg
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
