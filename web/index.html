<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C3D Explorer Web - 3D Biomechanics Motion Analysis</title>
    <meta name="description" content="High-performance client-side 3D motion capture C3D file explorer, 3D trajectory viewer, analog signal plotter, and event analysis.">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Three.js and OrbitControls (Local offline with CDN fallback) -->
    <script src="libs/three.min.js"></script>
    <script src="libs/OrbitControls.js"></script>
</head>
<body>
    <div class="app-wrapper">
        <!-- Top Application Bar -->
        <header class="app-navbar">
            <div class="brand-section">
                <div class="brand-logo">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </div>
                <span class="brand-title">C3D Explorer</span>
                <span class="brand-badge">Web</span>
            </div>

            <div class="navbar-center">
                <div class="trial-info-chips">
                    <span id="trial-name" class="chip-name">No trial loaded</span>
                    <span class="chip-sep">•</span>
                    <span id="trial-frames" class="chip-meta">0 frames</span>
                    <span class="chip-sep">•</span>
                    <span id="trial-rate" class="chip-meta">0.0 Hz</span>
                    <span class="chip-sep">•</span>
                    <span id="trial-markers" class="chip-meta">0 markers</span>
                    <span class="chip-sep">•</span>
                    <span id="trial-analogs" class="chip-meta">0 analogs</span>
                </div>
            </div>

            <div class="navbar-actions">
                <input type="file" id="file-input" accept=".c3d" style="display: none;">
                <button id="btn-open-file" class="btn btn-primary" title="Open local C3D file">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    Open C3D
                </button>
                <button id="btn-load-sample" class="btn btn-secondary" title="Load sample trial">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    Load Sample
                </button>
                <button id="btn-open-events" class="btn btn-secondary" title="Manage events">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                    Events
                </button>
                <button id="btn-toggle-plotter" class="btn btn-secondary active" title="Toggle Plot Drawer">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    Plotter
                </button>
            </div>
        </header>

        <!-- Main Workspace (Data Explorer + 3D Viewport + Plot Drawer) -->
        <main class="main-workspace">
            <!-- Left Data Explorer Panel -->
            <aside id="data-explorer-container" class="sidebar-panel"></aside>

            <!-- Center 3D Viewport & Plotter Section -->
            <section class="viewport-wrapper">
                <!-- Three.js Canvas Container -->
                <div id="viewport-3d-container"></div>

                <!-- Floating 3D Toolbar -->
                <div class="viewport-toolbar">
                    <button id="btn-reset-cam" class="btn-xs" title="Reset Camera">Reset Cam</button>
                    <select id="select-cam-preset" class="toolbar-select" title="Camera Preset Views">
                        <option value="isometric" selected>Isometric</option>
                        <option value="front">Front (Y+)</option>
                        <option value="back">Back (Y-)</option>
                        <option value="right">Right (X+)</option>
                        <option value="left">Left (X-)</option>
                        <option value="top">Top (Z+)</option>
                    </select>
                    <button id="btn-toggle-grid" class="btn-xs active" title="Toggle Ground Grid">Grid</button>
                    <button id="btn-toggle-axes" class="btn-xs active" title="Toggle XYZ Axes">Axes</button>
                    <button id="btn-toggle-traj" class="btn-xs" title="Toggle 3D Trajectory Ribbon">Tails</button>
                </div>

                <!-- Bottom Expandable Plot Drawer -->
                <div id="plot-drawer" class="plot-drawer">
                    <div class="plot-drawer-header">
                        <span class="plot-drawer-title">Coordinate & Signal Plotter</span>
                        <div class="plot-drawer-actions">
                            <button id="btn-fit-roi" class="btn-xs" title="Fit plot to ROI trim range">Fit to ROI</button>
                            <button id="btn-auto-range" class="btn-xs" title="Reset X/Y view to full range">Auto Range</button>
                            <button id="btn-close-plotter" class="btn-xs" title="Close Plotter">&times;</button>
                        </div>
                    </div>
                    <div class="plot-canvas-container">
                        <canvas id="plot-canvas"></canvas>
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Timeline Scrubber Bar -->
        <footer id="timeline-bar-container" class="timeline-bar-wrapper"></footer>
    </div>

    <!-- Modals & Overlays -->
    <div id="event-modal" class="modal-overlay"></div>
    <div id="marker-3d-tooltip"></div>
    <div id="plot-tooltip"></div>

    <!-- Drag & Drop Zone Overlay -->
    <div id="drop-zone" class="drop-zone-overlay">
        <div class="drop-zone-content">Drop .c3d file here to open</div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text" style="color: #fff; font-size: 13px; font-weight: 500;">Loading...</div>
    </div>

    <!-- Application Script Entry -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
